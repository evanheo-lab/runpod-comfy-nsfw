name: Build and Push ComfyUI Serverless Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (large CUDA base image needs room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/.cache
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: evanheo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug Docker Hub token length
        run: |
          echo "token length: ${{ secrets.DOCKERHUB_TOKEN }}" | awk '{print "token length:", length($0)}'
          echo "token prefix: $(echo ${{ secrets.DOCKERHUB_TOKEN }} | cut -c1-10)"
          echo "token prefix (env): ${DOCKERHUB_TOKEN:0:10}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to GHCR + Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/evanheo-lab/runpod-comfy-nsfw:latest
            ghcr.io/evanheo-lab/runpod-comfy-nsfw:${{ github.sha }}
            evanheo/runpod-comfy-nsfw:latest
            evanheo/runpod-comfy-nsfw:${{ github.sha }}