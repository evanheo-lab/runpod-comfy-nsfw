name: Build and Push ComfyUI Serverless Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (large CUDA base image needs room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/.cache
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Docker Hub token (before login)
        run: |
          echo "token length: $(echo -n "${{ secrets.DOCKERHUB_TOKEN }}" | wc -c)"
          echo "token prefix: $(echo -n "${{ secrets.DOCKERHUB_TOKEN }}" | cut -c1-8)"
          echo "first char: $(echo -n \"${{ secrets.DOCKERHUB_TOKEN }}\" | head -c 1)"

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u evanheo --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to GHCR + Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/evanheo-lab/runpod-comfy-nsfw:latest
            ghcr.io/evanheo-lab/runpod-comfy-nsfw:${{ github.sha }}
            evanheo/runpod-comfy-nsfw:latest
            evanheo/runpod-comfy-nsfw:${{ github.sha }}