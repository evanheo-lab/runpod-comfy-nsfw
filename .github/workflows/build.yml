name: Build and Push ComfyUI Serverless Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (large CUDA base image needs room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/.cache
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/evanheo-lab/runpod-comfy-nsfw:latest
            ghcr.io/evanheo-lab/runpod-comfy-nsfw:${{ github.sha }}

      - name: Push to RunPod Registry (GHCR private → RunPod은 pull 불가)
        run: |
          docker pull ghcr.io/evanheo-lab/runpod-comfy-nsfw:latest
          docker tag ghcr.io/evanheo-lab/runpod-comfy-nsfw:latest registry.runpod.net/user_3HyhfnH5HQPxMq3NW0QlEomjEzP/runpod-comfy-nsfw:latest
          echo "${{ secrets.RUNPOD_REGISTRY_TOKEN }}" | docker login registry.runpod.net -u user_3HyhfnH5HQPxMq3NW0QlEomjEzP --password-stdin
          docker push registry.runpod.net/user_3HyhfnH5HQPxMq3NW0QlEomjEzP/runpod-comfy-nsfw:latest